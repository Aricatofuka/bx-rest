<div class="app">
  <header class="app__header">
    <h1>{{ t.app.title('Angular') }}</h1>
    <p>{{ t.app.subtitle }}</p>
  </header>

  <mat-card class="connection-card">
    <mat-card-content>
      <app-connection-form
        [connection]="connection"
        [applied]="applied"
        [isValid]="isValid"
        (connectionChange)="onConnectionChange($event)"
        (connect)="connect()"
      ></app-connection-form>
    </mat-card-content>
  </mat-card>

  <main class="app__main">
    <mat-card class="app__editor">
      <mat-card-content>
        <app-recipe-picker (pick)="pickRecipe($event)"></app-recipe-picker>
        <app-code-editor [value]="code" (valueChange)="code = $event"></app-code-editor>
        <button mat-raised-button color="primary" class="run-button" [disabled]="!applied" (click)="run()">
          {{ t.editor.runButton }}
        </button>
        @if (!applied) {
          <p class="app__hint">{{ t.editor.connectFirstHint }}</p>
        }
      </mat-card-content>
    </mat-card>

    <section class="app__results">
      <h2>{{ t.results.heading }}</h2>
      <app-result-panel [results]="results"></app-result-panel>
    </section>
  </main>

  <app-toast-host></app-toast-host>
</div>
